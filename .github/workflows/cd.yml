name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.19

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Go services
      run: |
        for service in go/services/*; do
          cd $service
          docker build -t autonomouspen/$(basename $service):latest .
          docker push autonomouspen/$(basename $service):latest
          cd -
        done

    - name: Build and push Python components
      run: |
        for component in python/ai_components/*; do
          cd $component
          docker build -t autonomouspen/$(basename $component):latest .
          docker push autonomouspen/$(basename $component):latest
          cd -
        done

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.24.0'

    - name: Deploy to Kubernetes
      run: |
        # Configure kubectl to connect to your cluster
        # (e.g., using secrets to store kubeconfig)

        kubectl apply -f k8s/
