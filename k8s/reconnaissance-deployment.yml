apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconnaissance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconnaissance
  template:
    metadata:
      labels:
        app: reconnaissance
    spec:
      containers:
      - name: reconnaissance
        image: autonomouspen/reconnaissance
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reconnaissance
spec:
  selector:
    app: reconnaissance
  ports:
  - port: 80
    targetPort: 8080
